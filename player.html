<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>ReelRift Player</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#08090d;color:#f7f7fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d}
body{display:grid;place-items:center;padding:18px}
.player{width:min(100%,1100px);border:1px solid #292a35;border-radius:18px;overflow:hidden;background:#101117;box-shadow:0 24px 80px #0009}
.screen{position:relative;aspect-ratio:16/9;background:#050609;display:grid;place-items:center}
video{display:block;width:100%;height:100%;object-fit:contain;background:#050609}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#24202a,#08090d 70%)}
.empty[hidden]{display:none}.empty-inner{max-width:520px}.mark{font-weight:900;letter-spacing:.13em;color:#ff5364;font-size:12px}
h1{font-size:clamp(20px,4vw,30px);margin:12px 0 8px}.desc{color:#a9aab8;line-height:1.6;font-size:14px;margin:0}
.controls{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
button{border:1px solid #353642;background:#1a1b24;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button:hover{border-color:#ff5364}button:disabled{opacity:.45;cursor:not-allowed}
input[type=range]{accent-color:#ff5364;min-width:90px;flex:1}
.time{font-size:12px;color:#b9bac6;font-variant-numeric:tabular-nums;white-space:nowrap}
#volume{max-width:100px}.status{padding:0 16px 14px;color:#9899a8;font-size:12px}
@media(max-width:520px){body{padding:0}.player{border-radius:0;border-left:0;border-right:0}.controls{gap:8px;padding:11px}.time{font-size:11px}button{padding:8px 10px}}
</style>
</head>
<body>
<main class="player">
  <div class="screen">
    <video id="video" playsinline preload="metadata"></video>
    <section class="empty" id="empty">
      <div class="empty-inner">
        <div class="mark">REELRIFT • SERVER 3</div>
        <h1>ReelRift Player</h1>
        <p class="desc" id="message">This is your own HTML5 player. Add a direct video URL that you own or are authorized to stream in Admin → Server 3.</p>
      </div>
    </section>
  </div>
  <div class="controls">
    <button id="play" type="button" disabled>Play</button>
    <span class="time" id="current">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
    <span class="time" id="duration">0:00</span>
    <button id="mute" type="button" disabled>Mute</button>
    <input id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume" disabled>
    <button id="full" type="button" disabled>Fullscreen</button>
  </div>
  <div class="status" id="status" role="status">Waiting for an authorized video source.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script>
(function(){
  const video=document.getElementById("video"), empty=document.getElementById("empty");
  const message=document.getElementById("message"), status=document.getElementById("status");
  const play=document.getElementById("play"), seek=document.getElementById("seek");
  const current=document.getElementById("current"), duration=document.getElementById("duration");
  const mute=document.getElementById("mute"), volume=document.getElementById("volume"), full=document.getElementById("full");
  const source=new URLSearchParams(location.search).get("src");
  let hls=null;
  const time=v=>{if(!Number.isFinite(v))return "0:00";const m=Math.floor(v/60),s=Math.floor(v%60);return m+":"+(s<10?"0":"")+s};
  function fail(text){empty.hidden=false;message.textContent=text;status.textContent=text}
  if(!source){fail("No video source is configured yet. In the ReelRift admin panel, enter a direct MP4, WebM, Ogg, or M3U8 URL in the Server 3 field. Use only content you own or have permission to stream.");}
  else {
    let url;
    try{url=new URL(source);if(!["https:","http:"].includes(url.protocol))throw new Error();}
    catch(e){fail("Invalid video URL. Please use a valid HTTPS or HTTP media link.");return;}
    const isHls=/\.m3u8$/i.test(url.pathname);
    empty.hidden=true;
    if(isHls && video.canPlayType("application/vnd.apple.mpegurl")) video.src=url.href;
    else if(isHls && window.Hls && Hls.isSupported()){
      hls=new Hls({enableWorker:true});hls.loadSource(url.href);hls.attachMedia(video);
      hls.on(Hls.Events.ERROR,function(_,data){if(data.fatal){status.textContent="Unable to load this HLS stream. Check the source URL and CORS settings.";hls.destroy();}});
    } else if(isHls){fail("This browser cannot play HLS. Try a supported browser or provide an MP4/WebM source.");}
    else video.src=url.href;
    video.addEventListener("error",()=>{status.textContent="Video could not be loaded. Check that the link is a direct media URL and allows cross-origin playback.";});
    video.addEventListener("loadedmetadata",()=>{[play,seek,mute,volume,full].forEach(x=>x.disabled=false);duration.textContent=time(video.duration);status.textContent="Ready to play.";});
  }
  play.addEventListener("click",()=>video.paused?video.play().catch(()=>{status.textContent="Tap Play again to start playback.";}):video.pause());
  video.addEventListener("play",()=>play.textContent="Pause");video.addEventListener("pause",()=>play.textContent="Play");
  video.addEventListener("timeupdate",()=>{current.textContent=time(video.currentTime);if(Number.isFinite(video.duration)&&video.duration>0)seek.value=String(video.currentTime/video.duration*1000)});
  seek.addEventListener("input",()=>{if(Number.isFinite(video.duration))video.currentTime=Number(seek.value)/1000*video.duration});
  mute.addEventListener("click",()=>{video.muted=!video.muted;mute.textContent=video.muted?"Unmute":"Mute"});
  volume.addEventListener("input",()=>{video.volume=Number(volume.value);video.muted=video.volume===0;mute.textContent=video.muted?"Unmute":"Mute"});
  full.addEventListener("click",()=>{const target=document.querySelector(".screen");if(document.fullscreenElement)document.exitFullscreen?.();else target.requestFullscreen?.()});
  window.addEventListener("pagehide",()=>{if(hls)hls.destroy()});
})();
</script>
</body>
</html>

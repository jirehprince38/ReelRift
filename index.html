<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReelRift — Stream Movies & TV Series</title>
<meta name="description" content="ReelRift is a modern platform for discovering popular movies and TV series with a smooth streaming experience." />
<link rel="stylesheet" href="/style.css" />
</head>
<body>


  <!-- Header -->
  <header class="site-header">

    <div class="wrap header-inner">

      <!-- Logo -->
      <a
        class="logo"
        href="/"
        aria-label="ReelRift Home"
      >
        <span class="dot"></span>
        REEL<span class="b">RIFT</span>
      </a>

      <!-- Navigation -->
      <nav
        class="nav"
        aria-label="Main navigation"
      >

        <button
          data-nav="home"
          class="active"
          type="button"
        >
          Home
        </button>

        <button
          data-nav="movies"
          type="button"
        >
          Movies
        </button>

        <button
          data-nav="tv"
          type="button"
        >
          TV Series
        </button>

        <button
          data-nav="updates"
          type="button"
        >
          Updates
        </button>

      </nav>

      <!-- Search -->
      <div class="search">

        <label
          for="searchInput"
          class="sr-only"
        >
          
        </label>

        <input
          id="searchInput"
          type="search"
          placeholder="Search movies or TV series…"
          autocomplete="off"
          aria-label="Search movies or TV series"
        >

        <button
          class="btn primary"
          id="searchBtn"
          type="button"
        >
          Search
        </button>

      </div>

    </div>

  </header>


  <!-- Main Content -->
  <main
    class="wrap"
    id="app"
  >
  </main>


  <!-- Footer -->
  <footer class="site-footer">

    <div
      class="wrap"
      id="siteFooter"
    >
    </div>

  </footer>


  <!-- JavaScript -->
  


<script src="/script.js"></script>
</body>
</html>
